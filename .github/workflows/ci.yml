name: Verifica e build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Build dimostrativa senza accesso a dati reali
        run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: expenses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verifica SQL e isolamento dei nuclei su database temporaneo
        env:
          PGPASSWORD: ci-disposable-only
        run: |
          psql -h localhost -U postgres -d expenses_test -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
          psql -h localhost -U postgres -d expenses_test -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -h localhost -U postgres -d expenses_test -v ON_ERROR_STOP=1 -f tests/database.sql
